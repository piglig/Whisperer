version: "2"
sql:
  - engine: "sqlite"
    schema:
      - "internal/store/migrations"
    queries:
      - "internal/store/queries"
    gen:
      go:
        package: "storesqlc"
        out: "internal/store/storesqlc"
        emit_json_tags: true
        emit_empty_slices: true
        rename:
          safe: "Save"
          npc: "NPC"
