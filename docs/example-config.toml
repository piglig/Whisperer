# Whisperer configuration example.
#
# Default locations:
#   - $XDG_CONFIG_HOME/whisperer/config.toml
#   - $HOME/.config/whisperer/config.toml
#   - %APPDATA%/whisperer/config.toml on Windows
#
# Override with:
#   whisperer --config /path/to/config.toml
#
# Precedence:
#   CLI flags > environment variables > this file > built-in defaults
#
# Do not put API keys in this file. Use environment variables:
#   ANTHROPIC_API_KEY
#   OPENROUTER_API_KEY
#   OPENAI_API_KEY
#   XAI_API_KEY
#   GEMINI_API_KEY

# ---- LLM provider ---------------------------------------------------------

provider = "anthropic"                 # anthropic | openrouter | openai | grok | gemini
# model = "claude-sonnet-4-7-20260101"
# model_helper = "claude-haiku-4-5"

# ---- Semantic memory and judge -------------------------------------------

embedder = "openai"                    # openai | openai_compat | fake | off
embedder_model = "text-embedding-3-small"
embedder_base_url = "https://api.openai.com/v1"
embedder_api_key_env = "OPENAI_API_KEY"

enable_judge = false
# judge_model = "claude-haiku-4-5"

# ---- Scenario and save ----------------------------------------------------

scenario = "fog_harbor"
# save = "01HZX..."
# variant = "vance_executes"
# seed = 42

# ---- Persistence ----------------------------------------------------------

db_path = "whisperer.db"
memory_dir = "mem"
trace_dir = "runs"
meta_path = "runs/meta.json"

# ---- Logging --------------------------------------------------------------

log_format = "text"                    # text | json
log_level = "info"                     # debug | info | warn | error

# ---- UI -------------------------------------------------------------------

# lang = "zh-CN"                       # zh-CN | en | auto

# ---- LLM network behavior -------------------------------------------------

llm_max_retries = 3
llm_timeout = "120s"
