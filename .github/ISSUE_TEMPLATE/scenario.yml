name: Scenario proposal
description: Propose a new scenario or a scenario quality improvement.
title: "[scenario] "
labels: ["scenario", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Scenario work should be original or clearly safe to distribute. Please read:
        - `specs/05-scenario-and-triggers.md`
        - `specs/08-fog-harbor-canon.md`
        - `CONTRIBUTING.md`

  - type: dropdown
    id: kind
    attributes:
      label: Proposal type
      options:
        - New scenario
        - Existing scenario improvement
        - Authoring/tooling improvement
        - Content bug
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Scenario title
      placeholder: "Example: The Ash House"
    validations:
      required: true

  - type: textarea
    id: pitch
    attributes:
      label: Player-facing pitch
      description: What hook does the investigator receive?
    validations:
      required: true

  - type: textarea
    id: structure
    attributes:
      label: Structure
      description: Locations, NPCs, clue count, endings, variants, and expected length.
    validations:
      required: true

  - type: textarea
    id: clue_design
    attributes:
      label: Clue design
      description: Explain key conclusions and Three Clue Rule redundancy.
    validations:
      required: true

  - type: textarea
    id: authoring
    attributes:
      label: Authoring coverage
      description: Proposed playtest paths and verify gates.
    validations:
      required: false

  - type: textarea
    id: rights
    attributes:
      label: Rights and source material
      description: Confirm the work is original, public domain, or otherwise safe to distribute.
    validations:
      required: true
