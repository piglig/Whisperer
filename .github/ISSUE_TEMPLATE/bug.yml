name: Bug report
description: Report behavior that differs from the expected product or engineering contract.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce it locally.
        Do not include API keys or unredacted private traces.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run `git rev-parse HEAD` for source builds.
      placeholder: "v0.3.1 or commit hash"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Run `go version`.
      placeholder: "go1.25.8 darwin/arm64"
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: Affected lane
      options:
        - Runtime
        - Authoring
        - Observability
        - Documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options:
        - Anthropic
        - OpenRouter
        - OpenAI
        - Grok / xAI
        - Gemini
        - Not related to LLM
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Provide exact commands and player inputs when possible.
      placeholder: |
        1. `./whisperer --variant calvin_directs --seed 42`
        2. Enter `去教堂`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Attach redacted trace snippets when useful.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Local validation
      description: Commands you ran, such as `go test ./...` or `scenario verify`.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
