name: Feature request
description: Propose a product, authoring, observability, or architecture improvement.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the workflow or problem. Solutions are welcome, but context is more useful than implementation detail.

  - type: dropdown
    id: lane
    attributes:
      label: Primary lane
      options:
        - Runtime
        - Authoring
        - Observability
        - Documentation
        - Architecture
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the user-facing behavior first. Implementation ideas are optional.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches would be acceptable or unacceptable?
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: How should this be validated?
      description: Runtime flow, authoring gate, replay trace, tests, or manual scenario.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, traces, examples, related issues, or reference products.
    validations:
      required: false
