name: Feature request
description: 提一个新功能或改进。
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先**描述场景**再提**方案**——避免 XY 问题。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述你正在做什么、卡在哪、为什么现状不够好。
      placeholder: 例：跑了 5 局后还是不知道哪些 trigger 还没触发过——希望能在 TUI 里看到当前进度。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你想到的方案
      description: 不要求详细——粗想法即可。如果有 mockup / 草图也欢迎贴。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 别的方法为什么不够好？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他上下文
      description: 相关的 issue、参考产品、使用场景。
    validations:
      required: false
